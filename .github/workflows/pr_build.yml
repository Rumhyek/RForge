name: Build and Test

on:
  pull_request:
    branches: [main]
  # Allows for running manually from Actions tab
  workflow_dispatch:

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/RForge

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Build with dotnet
        run: dotnet build --configuration Release

      # Test projects run on every target framework they declare.
      - name: Test with dotnet
        run: dotnet test --configuration Release --no-build

      # Build the packed Events package the way an app would, on the .NET 8 SDK (pinned by the
      # project's global.json) and on the newest SDK. See tests/RForge.Blazor.Events.ConsumerSmoke.
      - name: Pack Events for the consumer smoke test
        run: dotnet pack RForge.Blazor.Events/RForge.Blazor.Events.csproj --configuration Release --output "${{ runner.temp }}/smoke-feed" -p:Version=0.0.0-smoke

      - name: Consumer smoke test (.NET 8 SDK, C# 12)
        working-directory: tests/RForge.Blazor.Events.ConsumerSmoke/Sdk8
        run: |
          dotnet --version
          dotnet build "-p:RestoreSources=${{ runner.temp }}/smoke-feed%3Bhttps://api.nuget.org/v3/index.json"

      - name: Consumer smoke test (net8 app, C# 13 or later)
        working-directory: tests/RForge.Blazor.Events.ConsumerSmoke/Latest
        run: dotnet build "-p:RestoreSources=${{ runner.temp }}/smoke-feed%3Bhttps://api.nuget.org/v3/index.json"
