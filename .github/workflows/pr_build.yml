name: Build and Test

on:
  pull_request:
    branches: [main]
  # Allows for running manually from Actions tab
  workflow_dispatch:

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/RForge

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Build with dotnet
        run: dotnet build --configuration Release

      # Test projects run on every target framework they declare.
      - name: Test with dotnet
        run: dotnet test --configuration Release --no-build

      # Pack every package and build them the way an app would. See tests/RForge.Blazor.ConsumerSmoke.
      - name: Pack the packages for the consumer smoke tests
        run: dotnet pack --configuration Release --output "${{ runner.temp }}/smoke-feed" -p:Version=0.0.0-smoke

      # The RForge.Blazor bundle has to depend on every package and must not hide their analyzers.
      - name: Check the RForge.Blazor bundle package
        run: |
          nupkg="${{ runner.temp }}/smoke-feed/RForge.Blazor.0.0.0-smoke.nupkg"
          nuspec="$(unzip -p "$nupkg" RForge.Blazor.nuspec)"
          for id in Components Abstractions Events AutoApi.Abstractions AutoApi.Generator; do
            echo "$nuspec" | grep -q "id=\"RForge.Blazor.$id\"" || { echo "::error::The bundle does not depend on RForge.Blazor.$id"; exit 1; }
          done
          if echo "$nuspec" | grep -q 'exclude='; then
            echo "::error::A bundle dependency sets exclude=, so its analyzers would not reach the app (use PrivateAssets=\"none\")"; exit 1
          fi
          if unzip -l "$nupkg" | grep -q ' lib/'; then
            echo "::error::The bundle must not contain a lib folder"; exit 1
          fi

      - name: Consumer smoke test (.NET 8 SDK, C# 12)
        working-directory: tests/RForge.Blazor.ConsumerSmoke/Sdk8
        run: |
          dotnet --version
          dotnet build "-p:RestoreSources=${{ runner.temp }}/smoke-feed%3Bhttps://api.nuget.org/v3/index.json"

      - name: Consumer smoke test (net8 app, C# 13 or later)
        working-directory: tests/RForge.Blazor.ConsumerSmoke/Latest
        run: dotnet build "-p:RestoreSources=${{ runner.temp }}/smoke-feed%3Bhttps://api.nuget.org/v3/index.json"

      - name: Consumer smoke test (RForge.Blazor bundle only)
        working-directory: tests/RForge.Blazor.ConsumerSmoke/Bundle
        run: dotnet build "-p:RestoreSources=${{ runner.temp }}/smoke-feed%3Bhttps://api.nuget.org/v3/index.json"
